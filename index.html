<html>
    <head>
        <title>SHOPPING LIST</title>
        <link href="style.css"  rel="stylesheet"  type="text/css">
    </head>
    <body>
        <h1>SHOPPING ITEMS</h1>
        <div class="main">
            <div class="items"  >
                <form>Item</form>
                <input type="text"  placeholder="Type Items Here"  id="itemtext"  >
            </div>
            <div  class="qunty" >
                <form>Quantities</form>
                <input type="text" placeholder="Type Quantities Here" id="quantytext"  >
            </div>
            <div class="amount" >
                <form>Amount</form>
                <input type="number" placeholder="Type Amount Here" id="Amounttext">
            </div>
            <button id="add-button" onclick="addFuction()" >Add</button>
            <script src="java.js" ></script>
        </div>
        <div  class="list" >
            <ul id="itemlist"></ul>
        </div>
    </body>
</html>
